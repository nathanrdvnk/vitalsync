name: CI/CD VitalSync

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/vitalsync-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/vitalsync-frontend

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run ESLint
        working-directory: ./backend
        run: npx eslint . --ext .js

      - name: Run tests
        working-directory: ./backend
        run: npm test

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=vitalsync" >> .env
          echo "DB_USER=vitalsync_user" >> .env
          echo "DB_PASSWORD=vitalsync_password" >> .env

      - name: Start services
        run: docker-compose up -d --build

      - name: Wait for backend to be ready
        run: sleep 10

      - name: Health check
        run: |
          curl --fail http://localhost:3000/health || \
          (echo "Health check failed!" && docker-compose logs backend && exit 1)

      - name: Stop services
        if: always()
        run: docker-compose down